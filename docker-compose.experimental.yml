# Standalone experimental stack. It deliberately uses a different service,
# container, host port, image tag, and data volume from SeriousSportSync stable
# so both can run at the same time without sharing or migrating live state.
services:
  serioussportsync-experimental:
    container_name: serioussportsync-experimental
    image: ghcr.io/monkfish1337/serioussportsync:experimental-newznab
    restart: unless-stopped
    env_file:
      - .env.experimental
    environment:
      PORT: "7000"
      EXPERIMENTAL_NATIVE_NEWZNAB: "on"
    volumes:
      - serioussportsync_experimental_data:/app/data
    ports:
      - "7001:7000"

volumes:
  serioussportsync_experimental_data:
