services:
  nzb-sport-pro:
    container_name: nzb-sport-pro
    image: ghcr.io/monkfish1337/nzb-sport-pro:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Defaults — env_file overrides these. Listed here so the schema is
      # discoverable without opening .env.example.
      PORT: "7000"
      ADDON_TYPE: "${ADDON_TYPE:-movie}"
      TSDB_API_KEY: "${TSDB_API_KEY:-123}"
      TSDB_SEASONS: "${TSDB_SEASONS:-auto}"
      REFRESH_INTERVAL_HOURS: "${REFRESH_INTERVAL_HOURS:-6}"
      # Encrypts saved public configurations and protects operator login.
      SESSION_SECRET: "${SESSION_SECRET}"
      PUBLIC_URL: "${PUBLIC_URL}"
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      # Safe only when the published port is loopback-only and cloudflared is
      # the sole public entry point.
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-cloudflare}"
      ADMIN_USER: "${ADMIN_USER:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - nzb_sport_pro_data:/app/data
    ports:
      # Keep the origin off the LAN/Internet; point a host cloudflared tunnel
      # at http://localhost:7000. Change deliberately for another topology.
      - "127.0.0.1:7000:7000"

volumes:
  nzb_sport_pro_data:

# To attach to an existing reverse-proxy / *arr stack network instead of the
# default compose-created one, uncomment and replace the name below.
# networks:
#   default:
#     external: true
#     name: my-existing-network
