name: Publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: monkfish1337/nzb-sport-pro

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax check
        run: |
          set -e
          git ls-files '*.js' | while read -r file; do node --check "$file"; done
      - name: Public-host operations checks
        env:
          SESSION_SECRET: preflight-session-secret-000000000000000000000000
          SETUP_TOKEN: preflight-setup-token-000000000000
          ADMIN_USER: operator
          ADMIN_PASSWORD: preflight-admin-password
          PUBLIC_URL: https://nzb.example.test
          TRUST_PROXY_HEADERS: cloudflare
        run: |
          bash -n deploy/backup/backup-stack.sh deploy/backup/install-backup.sh
          node scripts/preflight-public-host.js .missing-ci-env
      - name: Product and playback tests
        env:
          SESSION_SECRET: ci-only-do-not-use-in-prod-0000000000000000000000000000000000
        run: |
          npm run test:public-page
          npm run test:native-newznab
          npm run test:manutd
          npm run test:nuvio

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
