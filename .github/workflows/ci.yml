name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax check
        run: |
          set -e
          git ls-files '*.js' | while read -r file; do node --check "$file"; done
      - name: Product and playback tests
        env:
          SESSION_SECRET: ci-only-do-not-use-in-prod-0000000000000000000000000000000000
        run: |
          npm run test:public-page
          npm run test:native-newznab
          npm run test:manutd
          npm run test:nuvio

  docker:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-do-not-use-in-prod-0000000000000000000000000000000000
      ADMIN_USER: ci-admin
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait --wait-timeout 120
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans
